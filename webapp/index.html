<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>RentaGift</title>
  <link rel="icon" href="/static/img/icon.png">
  <link rel="preload" as="image" href="/static/img/chest.webp">
  <link rel="preload" as="image" href="/static/img/splash/crown.webp">
  <link rel="preload" as="image" href="/static/img/splash/left.webp">
  <link rel="preload" as="image" href="/static/img/splash/right.webp">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta name="theme-color" content="#0f1115">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/css/app.css?v=20261127y">
</head>
<body>
  <!-- Splash: shield halves slam together, crown drops, logo rises, name + chest appear (js/splash.js). -->
  <div id="splash" role="status" aria-label="RentaGift">
    <div class="sp2-screen" id="sp2-screen">
      <div class="sp2-stage" id="sp2-stage">
        <div class="sp2-logo" id="sp2-logo">
          <div class="sp2-glow" id="sp2-glow"></div>
          <div class="sp2-ring" id="sp2-ring"></div>
          <img class="sp2-left" id="sp2-L" src="/static/img/splash/left.webp" alt="">
          <img class="sp2-right" id="sp2-R" src="/static/img/splash/right.webp" alt="">
          <img class="sp2-crown" id="sp2-C" src="/static/img/splash/crown.webp" alt="">
        </div>
        <div class="sp2-name" id="sp2-name">Renta<b>Gift</b></div>
        <div class="sp2-chest" id="sp2-chest"><img src="/static/img/chest.webp" alt=""></div>
      </div>
    </div>
  </div>
  <script src="/static/js/splash.js?v=1"></script>
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <h1 class="page-title" id="page-title"></h1>
    <main id="view" class="view"></main>
    <nav class="tabbar" id="tabbar"></nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/static/js/app.js?v=20261127y"></script>
</body>
</html>
